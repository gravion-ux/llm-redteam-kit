[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam-kit"
version = "0.1.0"
description = "Authorized LLM red-teaming evaluation toolkit: OWASP LLM Top 10 probe packs, heuristic scoring, CI regression gates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Priyanshu Kumar Thakur" },
]
keywords = ["llm", "red-team", "security", "prompt-injection", "owasp", "ai-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Core toolkit is standard-library only: no runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
llm-redteam-kit = "llm_redteam_kit.cli:main"

[tool.setuptools]
packages = ["llm_redteam_kit"]

[tool.setuptools.package-data]
llm_redteam_kit = ["packs/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
